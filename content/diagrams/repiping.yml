title: Re-Piping
description: Homes built with aging water piping may require a full or partial re-piping. This illustration shows the typical pipe locations and the areas where a leak, deterioration or a break may occur.
points:
- Main line connection
- Water meter & main shutoff valve
- Water softener connections
- Supply manifold
- Water heater connections
- Expansion tank
- Vent stack roof flashing
- Attic / ceiling pipe joints
- Toilet supply connections
- Showerhead & tub supply
- Shower valve & head
- Floor-level supply lines
- Refrigerator water line
- Kitchen sink supply
- Drain & vent stack joints
- Washer supply hoses
- Utility sink
- Hose bib (exterior)
- Exterior wall penetration
- Floor drain
- Under-slab drain joints & cleanout
- Sewer line to street
