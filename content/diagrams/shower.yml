title: Bathroom Shower
description: This diagram shows the areas where leaks can occur at various points in a shower enclosure area and in the shower pan base.
points:
- Deteriorated caulk — wall corner
- Shower arm penetration
- Showerhead connection
- Valve trim plate seal
- Body spray fittings
- Handheld hose connection
- Niche shelf-to-wall joint
- Niche bottom (ponding)
- Waterproof membrane breach
- Bench top & seams
- Wall-to-pan intersection
- Shower drain grate
- Curb — grout / slope failure
- Supply pipes & valve body (behind wall)
- Glass door hinge / clamp
- Glass-to-curb seal
- Pan liner fold / wrinkle
- Drain flange & weep holes
- Subfloor penetration / damage
- Drain-to-trap connection
- P-trap leak
