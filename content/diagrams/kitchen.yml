title: Kitchen
description: This diagram shows every possible area where the kitchen plumbing components may leak.
points:
- Side sprayer / soap dispenser
- Pull-down faucet & hose
- Filtered-water tap
- Pot filler joints
- Sink rim & caulk
- Countertop dispenser / air gap
- Basket strainer
- Disposal mounting
- Disposal dishwasher inlet
- P-trap slip joints
- Angle stop valves
- Filter canisters
- Instant hot-water unit
- Reverse-osmosis filter housings
- RO storage tank
- Dishwasher supply & drain connections
- Dishwasher door seal / tub
- Drain penetration (cabinet floor)
- In-wall supply joints
- In-wall drain joints
- Washer supply box
- Wall drain pipe penetration
- Floor drain
