title: Bathroom with Bathtub
description: This diagram shows the areas where leaks can occur at plumbing connection points in a typical bathroom with a bathtub.
points:
- Wall supply pipe joint (behind wall)
- Toilet tank fill valve connection
- Toilet shutoff valve
- Toilet base / wax ring
- Faucet handle & spout
- Drain flange under sink
- Sink shutoff valves & supply lines
- P-trap slip nuts
- Vanity drain connection
- Showerhead connection
- Shower valve (behind escutcheon)
- Tub spout connection
- Tub overflow gasket
- Tub drain gasket / stopper
- Tub waste pipe joint (behind wall)
- Floor drain grate & body
- Floor drain trap slip nuts
- Main waste stack joint (under floor)
- Water heater flexible connections
- Water heater T&P discharge pipe
