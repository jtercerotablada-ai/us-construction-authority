thermal:
  label: Infrared thermography
  heading: See what the *eye can’t.*
  lead: Our in-house infrared-certified thermography specialists diagnose hidden plumbing leaks and electrical faults — helping pinpoint what’s wrong before anything is opened up.
  points:
  - title: Hidden plumbing leaks
    text: Moisture behind walls, floors and ceilings shows up as a temperature difference.
  - title: Electrical faults
    text: Overheating breakers, loose connections and overloaded circuits stand out immediately.
  - title: Precise evaluations
    text: Pinpointing the problem means fewer surprises and more accurate estimates.
