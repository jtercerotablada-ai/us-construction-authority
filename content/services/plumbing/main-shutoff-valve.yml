title: Main Shutoff Valve & Hose Bibs
summary: Main valve replacement from ¾″ to 2″.
intro: A working main shutoff valve is your first line of defense in a plumbing emergency. We replace main shutoff valves in common sizes from ¾″ to 2″ and replace hose bibs.
options:
- ¾″ Valve
- 1-¼″ Valve
- 1-½″ Valve
- 2″ Valve
- Replace Hose Bib
reasons:
- The main valve is stuck or hard to turn
- The valve does not fully stop the water
- Leaks at the valve body or handle
- Dripping or broken outdoor hose bib
