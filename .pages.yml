        label: Ventilador de techo
      - value: sun
        label: Sol / luz exterior
      - value: power-off
        label: Sin electricidad
      - value: toggle-on
        label: Interruptor
      - value: table-cells
        label: Panel eléctrico
      - value: server
        label: Gabinete / panel
      - value: ethernet
        label: Tomacorriente
      - value: code-branch
        label: Circuitos
      - value: car-battery
        label: Generador / batería
      - value: temperature-arrow-up
        label: Temperatura alta
      - value: temperature-half
        label: Termómetro
      - value: triangle-exclamation
        label: Advertencia / peligro
