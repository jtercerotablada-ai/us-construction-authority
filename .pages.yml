- name: gallery
  label: Fotos de proyectos
  type: file
  path: content/gallery.yml
  format: yaml
  description: Sube fotos de trabajos terminados. La sección aparece sola cuando hay al menos una foto.
  fields:
  - name: heading
    label: Título de la sección
    type: string
    description: Escribe entre *asteriscos* las palabras que quieres en rojo e itálica.
    required: true
  - name: intro
    label: Texto de la sección
    type: text
  - name: projects
    label: Fotos
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: image
      label: Foto
      type: image
      required: true
      description: JPG, PNG o WebP. La web la reduce y optimiza sola.
    - name: title
      label: Descripción corta
      type: string
      description: 'Ejemplo: Kitchen re-piping in Port St. Lucie'
      required: true
    - name: category
      label: Mostrar en
      type: select
      required: true
      default: all
      options:
        values:
        - value: all
          label: Todas las páginas
        - value: plumbing
          label: Plomería
        - value: electrical
          label: Electricidad
        - value: building
          label: Construcción
        - value: commercial
          label: Comercial
- name: plumbing
  label: Servicios de plomería
  type: collection
