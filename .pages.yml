# Panel de edición de la web — Pages CMS (https://app.pagescms.org)
# Cada cambio guardado en el panel crea un commit en GitHub y la web se vuelve a publicar sola.
# Generado por _source/make_pages_config.py — los nombres de campos deben coincidir con content/*.yml y _source/build.py.
media:
  input: assets/img/uploads
  output: /assets/img/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
content:
- name: site
  label: Datos de la empresa
  type: file
  path: content/site.yml
  format: yaml
  description: Teléfonos, direcciones, correo, licencias y aviso superior. Aparecen en todas las páginas.
  fields:
  - name: company_name
    label: Nombre de la empresa
    type: string
    required: true
  - name: legal_name
    label: Razón social
    type: string
    description: Aparece en el aviso de derechos al final de la página.
    required: true
  - name: about_line
    label: Frase del pie de página
    type: text
    required: true
  - name: email
    label: Correo de contacto
    type: string
    description: Aquí llegan las solicitudes del formulario.
    required: true
    pattern:
      regex: ^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$
      message: Escribe un correo válido
  - name: offices
    label: Oficinas
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.region} · {fields.phone}'
    fields:
    - name: region
      label: Región
      type: string
      description: 'Ejemplo: Treasure Coast'
      required: true
    - name: phone
      label: Teléfono
      type: string
      description: 'Formato: (772) 289-2344'
      required: true
      pattern:
        regex: ^\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}$
        message: 'Escribe el teléfono así: (772) 289-2344'
    - name: street
      label: Dirección
      type: string
      required: true
    - name: city
      label: Ciudad
      type: string
      required: true
    - name: state
      label: Estado
      type: string
      description: 'Ejemplo: FL'
      required: true
    - name: zip
      label: Código postal
      type: string
      required: true
    description: La primera oficina es el teléfono principal de la web.
    required: true
  - name: licenses
    label: Licencias
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.label} · {fields.number}'
    fields:
    - name: type
      label: Tipo
      type: select
      required: true
      options:
        values:
        - value: building
          label: Construcción
        - value: electrical
          label: Electricidad
        - value: plumbing
          label: Plomería
        - value: other
          label: Otra
    - name: label
      label: Nombre
      type: string
      description: 'Ejemplo: Building'
      required: true
    - name: number
      label: Número de licencia
      type: string
      required: true
    required: true
  - name: announcement
    label: Aviso superior (barra roja)
    type: object
    fields:
    - name: show
      label: Mostrar el aviso
      type: boolean
      default: false
    - name: text
      label: Texto del aviso
      type: text
      description: Usa **doble asterisco** para negrita y *un asterisco* para itálica.
    - name: link_text
      label: Texto del enlace (opcional)
      type: string
      description: 'Ejemplo: Book now'
    - name: link
      label: Enlace (opcional)
      type: string
      description: 'Ejemplo: schedule.html o https://...'
      pattern:
        regex: ^(https?://\S+|mailto:\S+|tel:\S+|[\w\-./]+\.html(#[\w-]+)?|/\S*|#\S*)?$
        message: Usa una dirección que empiece con https:// o el nombre de una página, por ejemplo schedule.html
    description: Úsalo para promociones o avisos temporales (por ejemplo, temporada de huracanes).
  - name: final_cta
    label: Llamado final (al pie de cada página)
    type: object
    fields:
    - name: heading
      label: Título
      type: string
      description: Escribe entre *asteriscos* las palabras que quieres en rojo e itálica.
      required: true
    - name: lead
      label: Texto
      type: text
      required: true
    required: true
