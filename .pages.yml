        label: Casa
      - value: trowel-bricks
        label: Ladrillos (remodelación)
      - value: magnifying-glass
        label: Lupa (inspección)
      - value: file-signature
        label: Documento firmado (permisos)
      - value: helmet-safety
        label: Casco de obra
      - value: hammer
        label: Martillo
      - value: paint-roller
        label: Rodillo de pintura
      - value: ruler-combined
        label: Regla (medidas)
      - value: building
        label: Edificio
      - value: city
        label: Ciudad (comercial)
